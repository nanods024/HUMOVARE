<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A8121B" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect to the font and image CDNs so the first paint is not
         blocked waiting on a DNS + TLS round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>HUMOVARE — Built For Your Movement</title>
    <meta
      name="description"
      content="HUMOVARE menswear — printed heavyweight tees, brushed fleece hoodies, shirts and bottom wear. Not just clothing, a movement."
    />
    <link rel="canonical" href="https://humovare.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HUMOVARE" />
    <meta property="og:title" content="HUMOVARE — Built For Your Movement" />
    <meta
      property="og:description"
      content="Printed tees and heavyweight hoodies, built for your movement."
    />
    <meta property="og:url" content="https://humovare.in/" />
    <meta property="og:image" content="https://humovare.in/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HUMOVARE — Built For Your Movement" />
    <meta
      name="twitter:description"
      content="Printed tees and heavyweight hoodies, built for your movement."
    />
    <meta name="twitter:image" content="https://humovare.in/og-image.jpg" />
  </head>

</html>
